name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch or PR replaces the run still waiting or going,
# so stale runs don't sit in the queue ahead of the ones that matter
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # a full run takes about 6 minutes; a hung smoke test shouldn't hold the runner for hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Smoke test (plays the game in headless Chromium)
        run: npm run test:smoke
        timeout-minutes: 12
        env:
          SMOKE_SHOTS: smoke-shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore
