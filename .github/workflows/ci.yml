name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch or PR replaces the run still waiting or going,
# so stale runs don't sit in the queue ahead of the ones that matter
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # unit tests only; the Playwright smoke test runs locally before merging (see README)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
