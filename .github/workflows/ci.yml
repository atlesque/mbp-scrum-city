name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch or PR replaces the run still waiting or going,
# so stale runs don't sit in the queue ahead of the ones that matter
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # unit tests; the smoke job below plays the game
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    # plays the game in headless Chromium (tests/smoke.mjs); also runs on every push to main, direct pushes included.
    # A runner draws the game a few times slower than a laptop, so the steps are split over four of them.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    name: smoke (${{ matrix.part }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run test:smoke
        env:
          SMOKE_PART: ${{ matrix.part }}/4
